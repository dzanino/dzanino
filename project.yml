name: MeditationSikuta

options:
  bundleIdPrefix: com.dzanino
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.10"
  ENABLE_PREVIEWS: "YES"

targets:

  MeditationSikuta:
    type: application
    platform: iOS
    sources:
      - path: Shared
        createIntermediateGroups: true
      - path: MeditationSikuta
        createIntermediateGroups: true
    dependencies:
      - target: MeditationSikutaWatch
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dzanino.meditation-sikuta
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
      INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    info:
      path: MeditationSikuta/Info.plist

  MeditationSikutaWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
        createIntermediateGroups: true
      - path: MeditationSikutaWatch
        createIntermediateGroups: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dzanino.meditation-sikuta.watchkitapp
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "4"
    info:
      path: MeditationSikutaWatch/Info.plist
