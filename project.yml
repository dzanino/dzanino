name: MeditationSikuta

options:
  bundleIdPrefix: com.dzanino
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_PREVIEWS: "YES"
    DEVELOPMENT_TEAM: 92TUG3FDAV
    CODE_SIGN_STYLE: Automatic

configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig

targets:

  MeditationSikuta:
    type: application
    platform: iOS
    sources:
      - path: Shared
        createIntermediateGroups: true
      - path: MeditationSikuta
        createIntermediateGroups: true
    dependencies:
      - target: MeditationSikutaWatch
        embed: true
    configFiles:
      Debug: Configs/Signing.xcconfig
      Release: Configs/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzanino.meditation-sikuta
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 92TUG3FDAV
        CODE_SIGN_STYLE: Automatic
    info:
      path: MeditationSikuta/Info.plist

  MeditationSikutaWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
        createIntermediateGroups: true
      - path: MeditationSikutaWatch
        createIntermediateGroups: true
    configFiles:
      Debug: Configs/Signing.xcconfig
      Release: Configs/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzanino.meditation-sikuta.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        DEVELOPMENT_TEAM: 92TUG3FDAV
        CODE_SIGN_STYLE: Automatic
    info:
      path: MeditationSikutaWatch/Info.plist
